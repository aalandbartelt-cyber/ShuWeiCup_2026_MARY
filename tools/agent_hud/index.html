<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShuWei // AI Ops</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <main class="hud" id="hud">
    <header class="bar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div class="brand-text"><b>AI OPS</b><small>SHUWEI 2026</small></div>
      </div>
      <div class="agents" id="agents" aria-label="agents"></div>
      <div class="meta">
        <span class="bus-badge" id="bus-badge" hidden>BUS 0</span>
        <span class="phase" id="phase">PRE</span>
        <span class="clock"><i></i><b id="clock">--:--:--</b></span>
      </div>
      <button class="win-close" id="win-close" aria-label="close">×</button>
    </header>
    <div class="bar-sub">
      <span class="relay"><b id="owner-mini">CODEX</b><i>⇄</i><span>HANDOFF</span><i>⇄</i><span>CURSOR</span></span>
      <span class="age" id="handoff-age">--</span>
    </div>

    <section class="pop" id="popover" hidden>
      <button class="pop-close" id="pop-close" aria-label="close">×</button>
      <div class="pop-head">
        <div>
          <div class="eyebrow" id="pop-role">AGENT</div>
          <h2 id="pop-name">--</h2>
          <div class="pop-runtime" id="pop-runtime">--</div>
        </div>
        <span class="pop-status" id="pop-status">STANDBY</span>
      </div>
      <div class="pop-task" id="pop-task">--</div>
      <div class="pop-entry" id="pop-entry">--</div>
      <div class="pop-bus" id="pop-bus">BUS: no messages</div>
      <div class="pop-grid">
        <span>QUOTA <b id="pop-quota">--</b></span>
        <span>BRANCH <b id="pop-branch">--</b></span>
        <span>WORKTREE <b id="pop-dirty">--</b></span>
        <span>SKILL <b id="pop-skill">--</b></span>
        <span>SESSIONS <b id="pop-sessions">--</b></span>
        <span>OWNER <b id="pop-owner">--</b></span>
      </div>
      <div class="pop-cols">
        <div>
          <div class="col-title">NEXT 3</div>
          <ol class="task-list" id="tasks"><li class="empty">No handoff loaded.</li></ol>
        </div>
        <div>
          <div class="col-title danger">BLOCKED</div>
          <ul class="blocker-list" id="blockers"><li class="empty">None recorded.</li></ul>
        </div>
      </div>
      <div class="pop-foot">
        <span id="generated">--</span>
        <button class="copy-btn" id="copy-prompt">COPY CURSOR PROMPT</button>
      </div>
    </section>
  </main>
  <div class="toast" id="toast">Copied</div>
  <script src="/app.js"></script>
</body>
</html>
